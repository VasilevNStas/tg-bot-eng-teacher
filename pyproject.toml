[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-bot-eng-teacher"
version = "0.1.0"
description = "Telegram bot for learning English with LLM dialogue and deterministic exercises"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.15,<4",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.8,<3",
    "pyyaml>=6.0",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.1",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[project.scripts]
tg-bot-eng-teacher = "app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC109", "RUF001", "RUF002", "RUF003"]
"src/app/texts/**" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
