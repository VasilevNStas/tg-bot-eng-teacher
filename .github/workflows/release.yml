name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAG^{commit}" origin/main; then
            echo "tag $TAG is not on main" >&2
            exit 1
          fi

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VDS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          ssh -i ~/.ssh/deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VDS_USER@$VDS_HOST" "deploy $TAG"
