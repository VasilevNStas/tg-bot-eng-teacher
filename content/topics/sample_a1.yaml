topic:
  slug: sample-a1
  title: "Sample A1"
  level: A1
  description: "Небольшой пример для проверки импорта"
  tags: [sample, a1]

source: "Original (project sample)"
license: "unknown"

items:
  - slug: sample-irregular-go
    level: A1
    tags: [grammar:irregular-verbs]
    payload:
      kind: irregular_verb
      base: go
      past: [went]
      participle: [gone]
      translation_ru: идти
      base_ipa: "ɡəʊ"
      past_ipa: "wɛnt"
      participle_ipa: "ɡɒn"

  - slug: sample-gap-present-simple
    level: A1
    tags: [grammar:present-simple]
    payload:
      kind: gap_fill
      sentence: "She ___ to school every day."
      answer: goes
      accepted: ["goes"]
      hint_ru: "Present Simple, 3-е лицо"

  - slug: sample-translation-cinema
    level: A2
    tags: [theme:cinema]
    payload:
      kind: translation_pair
      prompt_ru: "Я вчера ходил в кино."
      reference: "I went to the cinema yesterday."
      accepted: ["I went to the cinema yesterday"]

  - slug: sample-word-order-cinema
    level: A2
    tags: [grammar:past-simple]
    payload:
      kind: word_order
      words: ["I", "went", "to", "the", "cinema"]
      answer: "I went to the cinema"

  - slug: sample-mc-since
    level: B1
    tags: [grammar:present-perfect]
    payload:
      kind: multiple_choice
      question: "I ___ here since 2020."
      options: ["live", "lived", "have lived"]
      correct_index: 2
      explanation_ru: "Present Perfect с since."
