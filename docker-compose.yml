name: tg-bot-eng-teacher

x-bot-service: &bot-service
  build:
    context: .
    dockerfile: Dockerfile
  image: tg-bot-eng-teacher:local
  user: "${BOT_UID:-10001}:${BOT_GID:-10001}"
  env_file:
    - path: .env
      required: false
  environment:
    DB_PATH: /app/data/bot.db
    PROMPTS_DIR: /app/prompts
    LOG_JSON: "true"
  volumes:
    - ./data:/app/data
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # One-shot schema/content init. Only this service runs migrations, so the
  # two bot processes never race on Alembic.
  migrate:
    <<: *bot-service
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.cli seed
    restart: "no"
    mem_limit: 320m
    cpus: 0.8

  bot:
    <<: *bot-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "health", "--service", "bot"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 320m
    cpus: 0.8

  # Separate token and allowlist. Start explicitly:
  #   docker compose --profile admin up -d
  admin-bot:
    <<: *bot-service
    profiles: ["admin"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # ADMIN_BOT_TOKEN and ADMIN_IDS come from .env.
    command:
      - python
      - -m
      - app.admin_bot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "health", "--service", "admin"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 192m
    cpus: 0.4
